<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT | Leagues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container py-4 py-lg-5">
    <div class="page-title">
        <p class="eyebrow">FOOTBALL</p>
        <h1>Leagues</h1>
        <p>Find a league and open its standings or statistics.</p>
    </div>

    <section class="info-card mb-4">
        <div class="row g-3">
            <div class="col-md-9">
                <label class="form-label">Search League</label>
                <input id="league-search" class="form-control" placeholder="Premier League">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button id="search-leagues" class="btn btn-primary w-100">Search</button>
            </div>
        </div>
        <p class="form-note">Try: Premier League, La Liga, Bundesliga, Serie A.</p>
    </section>

    <div id="leagues-container" class="row g-3"></div>
</main>

<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/sports.js"></script>
<script src="js/leagues.js"></script>
</body>
</html>
