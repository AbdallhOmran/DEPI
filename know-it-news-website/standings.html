<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT | Standings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container py-4 py-lg-5">
    <div class="page-title">
        <p class="eyebrow">FOOTBALL</p>
        <h1>Standings</h1>
        <p>League table with matches, wins, draws, losses and points.</p>
    </div>

    <section class="info-card mb-4">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label">League ID</label>
                <input id="standings-league" class="form-control" type="number" placeholder="39">
            </div>
            <div class="col-md-5">
                <label class="form-label">Season</label>
                <input id="standings-season" class="form-control" type="number">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button id="search-standings" class="btn btn-primary w-100">Search</button>
            </div>
        </div>
    </section>

    <section id="standings-container" class="info-card table-wrap"></section>
</main>

<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/sports.js"></script>
<script src="js/standings.js"></script>
</body>
</html>
