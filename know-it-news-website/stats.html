<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT | Stats</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container py-4 py-lg-5">
    <div class="page-title">
        <p class="eyebrow">FOOTBALL</p>
        <h1>Statistics</h1>
        <p>Top scorers and disciplinary statistics.</p>
    </div>

    <section class="info-card mb-4">
        <div class="row g-3">
            <div class="col-md-5">
                <label class="form-label">League ID</label>
                <input id="stats-league" class="form-control" type="number" placeholder="39">
            </div>
            <div class="col-md-5">
                <label class="form-label">Season</label>
                <input id="stats-season" class="form-control" type="number">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button id="search-stats" class="btn btn-primary w-100">Search</button>
            </div>
        </div>
    </section>

    <div class="row g-4">
        <div class="col-lg-4">
            <section class="info-card">
                <h2 class="card-title">Top Scorers</h2>
                <div id="top-scorers"></div>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="info-card">
                <h2 class="card-title">Yellow Cards</h2>
                <div id="yellow-cards"></div>
            </section>
        </div>
        <div class="col-lg-4">
            <section class="info-card">
                <h2 class="card-title">Red Cards</h2>
                <div id="red-cards"></div>
            </section>
        </div>
    </div>
</main>

<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/sports.js"></script>
<script src="js/stats.js"></script>
</body>
</html>
