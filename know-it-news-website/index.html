<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT | Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container py-4 py-lg-5">
    <section class="hero mb-4">
        <div>
            <p class="eyebrow">KNOW IT</p>
            <h1>News, weather, currencies & football in one place.</h1>
            <p class="hero-text">A simple dashboard that brings the important daily information together.</p>
        </div>
        <div class="hero-links">
            <a href="fixtures.html" class="btn btn-primary">Football Fixtures</a>
            <a href="league.html" class="btn btn-light">Browse Leagues</a>
        </div>
    </section>

    <div class="row g-4">
        <main class="col-lg-8">
            <section class="section-block">
                <div class="section-heading">
                    <h2>Sports News</h2>
                    <a href="news.html?category=sports">View all</a>
                </div>
                <div id="sports-news" class="row g-3"></div>
            </section>

            <section class="section-block">
                <div class="section-heading">
                    <h2>Entertainment</h2>
                    <a href="news.html?category=entertainment">View all</a>
                </div>
                <div id="entertainment-news" class="row g-3"></div>
            </section>

            <section class="section-block">
                <div class="section-heading">
                    <h2>Education</h2>
                    <a href="news.html?category=education">View all</a>
                </div>
                <div id="education-news" class="row g-3"></div>
            </section>
        </main>

        <aside class="col-lg-4">
            <section id="temp" class="info-card mb-4 text-center"></section>
            <section id="currency" class="info-card mb-4"></section>
            <section id="live-matches" class="info-card"></section>
        </aside>
    </div>
</main>

<footer id="site-footer"></footer>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/weather.js"></script>
<script src="js/news.js"></script>
<script src="js/currency.js"></script>
<script src="js/sports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
