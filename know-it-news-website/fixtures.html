<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Know IT | Fixtures</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<main class="container py-4 py-lg-5">
    <div class="page-title">
        <p class="eyebrow">FOOTBALL</p>
        <h1>Fixtures</h1>
        <p>Search matches by league and date.</p>
    </div>

    <section class="info-card mb-4">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">League ID</label>
                <input id="fixture-league" class="form-control" type="number" placeholder="39">
            </div>
            <div class="col-md-3">
                <label class="form-label">From</label>
                <input id="fixture-from" class="form-control" type="date">
            </div>
            <div class="col-md-3">
                <label class="form-label">To</label>
                <input id="fixture-to" class="form-control" type="date">
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <button id="search-fixtures" class="btn btn-primary w-100">Search Fixtures</button>
            </div>
        </div>
        <!-- <p class="form-note">Demo mode is enabled until you add your own API key in <code>js/config.js</code>.</p> -->
    </section>

    <div id="fixtures-container" class="row g-3"></div>
</main>

<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/sports.js"></script>
<script src="js/fixtures.js"></script>
</body>
</html>
